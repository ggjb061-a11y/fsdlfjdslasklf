[project]
name = "autovulnscan"
version = "4.1.0"
description = "Automated security assessment framework for authorized penetration testing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "Jinja2>=3.1.0",
    "click>=8.0.0",
    "defusedxml>=0.7.1",
]
license = {text = "MIT"}
authors = [{name = "AutoVulnScan"}]
keywords = ["security", "pentesting", "scanner", "vulnerability", "recon"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.scripts]
autoscan = "autoscan:main"

[project.urls]
Repository = "https://github.com/ggjb061-a11y/fsdlfjdslasklf"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# ----- Ruff (linter + formatter) -----
[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["scans", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line-too-long - we have long static data (payloads/URLs)
    "N802",  # function name should be lowercase - allow _foo for check helpers
    "N803",  # argument name - allow for test fixtures
    "N806",  # variable in function should be lowercase
    "B008",  # function call in default arg - fine for safe sentinels
    "SIM105",# use contextlib.suppress - try/except pass is clearer
    "SIM108",# ternary vs if/else - sometimes clearer as if/else
    "UP007", # use X | Y - keep Union for 3.9 compat
    "UP006", # use list[] - keep List for 3.9 compat
    "UP017", # datetime timezone utc alias
    "RUF012",# mutable class default - our constants are safe
    "C408",  # dict() vs {} - dict() is fine for clarity
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N801", "N802", "N806", "B011"]
"scanner/checks/cves/*" = ["E501"]
"scanner/checks/famous_cves.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false

# ----- Pytest -----
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: tests that take > 1 second",
    "network: tests that require network (skipped by default)",
    "benchmark: performance benchmarks",
]

# ----- Coverage -----
[tool.coverage.run]
source = ["scanner", "autoscan"]
omit = [
    "scans/*",
    "tests/*",
    "setup.sh",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if typing.TYPE_CHECKING:",
]
show_missing = true
precision = 1
